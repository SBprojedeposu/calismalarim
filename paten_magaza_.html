<style>
    table {
        width: 80%; /*sayfanın %80'ini kaplasın*/

input{

}

input: :focus {

.modern-buton {
    background-color: #ff7e00;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    margin-left: 5px;
}

.modern-buton:hover {
    background-color: #e67200;
    transform: scale(1.05);
}
